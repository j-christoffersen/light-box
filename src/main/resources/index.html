<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>64x32 Dummy LED Matrix</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            image-rendering: pixelated; /* Keeps the LED edges sharp */
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:9092');
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function parseRgb(rgb) {
            return [
                (rgb >> 16) & 0xff,
                (rgb >> 8) & 0xff,
                rgb & 0xff
            ];
        }
        // Scale factor: Make each simulated LED pixel 10x10 real screen pixels
        const SCALE = 10; 
        canvas.width = 64 * SCALE;
        canvas.height = 32 * SCALE;

        socket.on('connect', () => console.log('connected!', socket.id));
        socket.on('connect_error', (err) => console.error('connect error:', err));
        socket.on('disconnect', (reason) => console.log('disconnected:', reason));

        socket.on('frame', (base64Data) => {
            console.log("Frame received", base64Data);
            const colorData = Uint8Array.fromBase64(base64Data);
            console.log("converted data", colorData)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calculate radius and center offsets for the circles
            const radius = (SCALE - 1) / 2;

            for (let y = 0; y < 32; y++) {
                for (let x = 0; x < 64; x++) {
                    const r = colorData[y * 64 * 3 + x * 3];
                    const g = colorData[y * 64 * 3 + x * 3 + 1];
                    const b = colorData[y * 64 * 3 + x * 3 + 2];

                    // console.log("????", r, g, b);
                    
                    // Find the center point X and Y for each LED pixel
                    const centerX = (x * SCALE) + (SCALE / 2);
                    const centerY = (y * SCALE) + (SCALE / 2);
                    
                    // Begin drawing the round LED path
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    
                    // Fill with the RGB color
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fill();
                }
            }
        });
    </script>
</body>
</html>
